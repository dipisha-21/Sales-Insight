name: Data checks

on:
  push:
  pull_request:

jobs:
  validate-generated-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate dataset
        run: python scripts/generate_sales_data.py
      - name: Validate dataset contract
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('data/generated_sales.csv')
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 60000, len(rows)
          assert len({r['order_id'] for r in rows}) == 60000
          for r in rows:
              assert int(r['quantity']) > 0
              assert 0 <= float(r['discount_pct']) <= 100
              assert abs(float(r['profit']) - (float(r['revenue']) - float(r['cost']))) < 0.02
          print('Validated 60,000 sales rows')
          PY
